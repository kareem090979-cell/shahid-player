<!DOCTYPE html>
<!-- HTML : APP24/MOB -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<script src='https://kit.fontawesome.com/a076d05399.js' crossorigin='anonymous'></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500&family=Roboto:wght@300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style type="text/css">
@import url('https://fonts.googleapis.com/css2?family=Readex+Pro&display=swap');

body {
padding:0;
margin:0;
user-select:none;
list-style:none;
background:#FFFFFF;
font-family: 'Readex Pro', sans-serif;
}

h3 {
text-align: right;
font-size: medium;
font-weight: 200;
margin: 0;
color: #fff;
}

header {
background:#26ab56;
padding: 0 10px;
color:#fff;
margin-bottom:10px;
position:fixed;
top:0;
height:60px;
width:100%;
box-shadow: 0px 0px 7px black;
z-index:10;
display: flex;
align-items: center;
justify-content: space-between;
box-sizing: border-box;
}

.header-btns {
display: flex;
gap: 5px;
}

.top-btn {
background: rgba(255, 255, 255, 0.2);
border: none;
color: #fff;
padding: 6px 10px;
border-radius: 6px;
cursor: pointer;
font-size: 12px;
display: flex;
align-items: center;
gap: 4px;
text-decoration: none;
font-family: 'Readex Pro', sans-serif;
}

.top-btn:active {
background: rgba(0, 0, 0, 0.3);
}

img {
width:30px;
}

#page:hover {
background:none;
}

#page {
margin-top:75px;
width:100%;
text-align: center;
}

#page a:hover {
background:#111;
}

#page a {
height:100px;
padding-top:2px;
padding-bottom:2px;
margin-bottom:11px;
border:2px solid #2ecb66;
border-radius:15px;
width:91%;
display:inline-block;
text-decoration: none;
}

#page a img {
height:100px;
margin-right:10px;
width:50px;
padding-bottom:4px;
}

#page a p {
text-align:center;
font-family: 'Readex Pro', sans-serif;
margin-top:35px;
display:inline-block;
font-weight:550;
color:#26ab56;
}
</style>

<style>
.sidenav {
height: 100%;
width: 0;
position: fixed;
z-index: 1;
top: 0;
right: 0;
background-color: #26ab56;
overflow-x: hidden;
transition: 0.5s;
padding-top: 60px;
}

.sidenav a {
padding: 8px 8px 8px 32px;
text-decoration: none;
font-size: 25px;
color: #fff;
display: block;
transition: 0.3s;
text-align: center;
font-family: 'Readex Pro', sans-serif;
}

.sidenav a:hover {
color: #d9c9c9;
}

.sidenav .closebtn {
position: absolute;
top: 0;
right: 0;
font-size: 20px;
margin-left: 0px;
}

@media screen and (max-height: 450px) {
.sidenav {padding-top: 15px;}
.sidenav a {font-size: 18px;}
}
</style>

<style>
.dropbtn {
padding: 16px;
font-size: 16px;
border: none;
cursor: pointer;
background: #26ab56;
}

.dropdown {
position: relative;
display: inline-block;
}

.dropdown-content {
display: none;
position: absolute;
background-color: #f9f9f9;
min-width: 160px;
box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
z-index: 1;
}

.dropdown-content a {
color: black;
padding: 12px 16px;
text-decoration: none;
display: block;
}

.dropdown-content a:hover {
background-color: #f1f1f1;
}

.dropdown:hover .dropdown-content {
display: block;
}
</style>
</head>

<body dir="rtl">

<header>
<h3>Star Cinema</h3>

<!-- أزرار التحكم العلوية (رجوع وتحديث) -->
<div class="header-btns">
    <button class="top-btn" onclick="history.back();">
        <i class="fa fa-arrow-right"></i> رجوع
    </button>
    <button class="top-btn" onclick="location.reload();">
        <i class="fa fa-refresh"></i> تحديث
    </button>
</div>
</header>

<div id="page">

<a href="go:live1">
<CENTER><p>بث مباشر</p></CENTER>
</a>

<a href="go:p1">

</a>

<a href="go:p2">
<CENTER><p>مسلسلات</p></CENTER>
</a>

<a href="go:progr1">
<CENTER><p>برامج تلفزيونية</p></CENTER>
</a>

<a href="go:marah1">
<CENTER><p>مسرحيات</p></CENTER>
</a>

<a href="go:p3">
<CENTER><p>افلام اجنبيه</p></CENTER>
</a>

</div>

<script>
function openNav() {
document.getElementById("mySidenav").style.width = "250px";
}

function closeNav() {
document.getElementById("mySidenav").style.width = "0";
}

// كود التحديث التلقائي كل 15 ثانية (15000 ميلي ثانية)
setTimeout(function(){
    location.reload();
}, 15000);
</script>
</body>
</html>
